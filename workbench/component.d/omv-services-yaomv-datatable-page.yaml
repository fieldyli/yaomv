# Native OMV read-only Markdown overview, retaining the existing route and component ID.
version: "1.0"
type: component
data:
  name: omv-services-yaomv-datatable-page
  type: textPage
  config:
    title: _("Yandex Disk")
    autoReload: 30000
    contentFormat: markdown
    hasCopyToClipboardButton: true
    request:
      service: Yaomv
      get:
        method: getOverview
