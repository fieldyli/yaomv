# Experimental percentage gauge for the read-only Yandex Disk RPC.
# A missing percentage returns null rather than inventing progress.
version: "1.0"
type: dashboard-widget
data:
  id: "1609e3fb-f2e7-4372-99a5-230fdd60e2e2"
  type: chart
  title: _("Yandex Disk synchronization")
  description: _("Shows the current Yandex Disk synchronization progress, when available.")
  reloadPeriod: 30000
  permissions:
    role:
      - admin
  chart:
    type: gauge
    min: 0
    max: 100
    displayValue: true
    request:
      service: Yaomv
      method: getProgress
    label:
      formatter: template
      formatterConfig: "{{ value | tofixed(0) }}%"
    dataConfig:
      - label: _("Progress")
        prop: progressPercent
        backgroundColor: "#2196f3"
