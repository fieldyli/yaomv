# Compact Dashboard widget using OMV's native progressBar cell.
# The bar shows cloud quota usage, not per-file synchronization progress.
version: "1.0"
type: dashboard-widget
data:
  id: "b93af39e-a1f0-4765-a82c-0ca589d7de72"
  type: datatable
  reloadPeriod: 30000
  permissions:
    role:
      - admin
  title: _("Yandex Disk")
  description: _("Synchronization state and cloud quota usage.")
  datatable:
    hasHeader: false
    hasFooter: false
    columns:
      - name: _("Status")
        prop: sync
        flexGrow: 3
        sortable: false
        cellTemplateName: template
        cellTemplateConfig: '{{ sync }}<br>{{ cloud }}'
      - name: _("Cloud usage")
        prop: usagePercent
        flexGrow: 5
        sortable: false
        cellTemplateName: progressBar
        cellTemplateConfig:
          text: '{{ usageText }}'
          warningThreshold: 90
          decimalPlaces: 1
    store:
      proxy:
        service: Yaomv
        get:
          method: getDashboardUsage
