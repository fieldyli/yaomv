# Compact read-only dashboard widget for Yandex Disk.
version: "1.0"
type: dashboard-widget
data:
  id: "b93af39e-a1f0-4765-a82c-0ca589d7de72"
  type: grid
  reloadPeriod: 30000
  permissions:
    role:
      - admin
  title: _("Yandex Disk")
  description: _("Synchronization status and cloud usage.")
  grid:
    item:
      content: '{{ name }}: {{ value }}'
      tooltip: '{{ name }}: {{ value }}'
      class: "omv-text-center"
      contentClass: "omv-text-nowrap"
    store:
      proxy:
        service: Yaomv
        get:
          method: getDashboardStatus
